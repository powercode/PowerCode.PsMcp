name: CI

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]
  workflow_call:

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore -bl:artifacts/restore.binlog

      - name: Build
        run: dotnet build --configuration Release --no-restore -bl:artifacts/build.binlog

      - name: Unit Tests
        run: dotnet test --configuration Release --no-build --report-trx --results-directory ./test-results -bl:artifacts/test.binlog

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results (${{ matrix.os }})
          path: ./test-results/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./test-results/
          retention-days: 14

      - name: Upload Binary Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binlogs-${{ matrix.os }}
          path: artifacts/*.binlog
          retention-days: 14

      - name: Upload Module Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: PowerCode.PsMcp-module
          path: artifacts/bin/PowerCode.PsMcp/release/
          retention-days: 14
